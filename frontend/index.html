<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14100d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)" />
    <title>CSM Silks — Pure Silk Sarees & Men's Silk | Kanchipuram Est. 1987</title>
    <meta name="description" content="CSM Silks — Premium Kanjivaram silk sarees and men's silk dhotis, shirts & veshtis from Kanchipuram. Bridal, festive, daily. Free blouse. Pan-India shipping." />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply saved theme before React hydrates to prevent flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('csm-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
