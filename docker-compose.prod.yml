# CSM Silks — Production Docker Compose
version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "python backend/manage.py migrate --noinput && gunicorn csm_backend.wsgi:application --chdir backend --bind 0.0.0.0:8000 --workers 4"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx serve dist -l 5173"
    restart: unless-stopped

  celery_worker:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery --workdir backend -A csm_backend worker --loglevel=info --concurrency=4

  celery_beat:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery --workdir backend -A csm_backend beat --loglevel=info

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: csm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csm_secret}
      POSTGRES_DB: csm_silks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csm -d csm_silks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
