# CSM Silks — Production Docker Compose
services:
  frontend_build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/dist
    command: sh -c "npm ci && npm run build && cp -r dist/* /dist/"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    depends_on:
      frontend_build:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgres://csm:${POSTGRES_PASSWORD:-csm_secret}@db:5432/csm_silks
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CHANNEL_LAYER_BACKEND=redis
      - BEHIND_REVERSE_PROXY=True
      - USE_X_FORWARDED_PROTO=True
      - SECURE_SSL_REDIRECT=False
      - OTP_DEV_FALLBACK_ENABLED=False
      - PAYMENT_DEV_FALLBACK_ENABLED=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
      - log_data:/app/backend/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      sh -c "python backend/manage.py check --deploy &&
      python backend/manage.py migrate --noinput &&
      python backend/manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 csm_backend.asgi:application"

  celery_worker:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgres://csm:${POSTGRES_PASSWORD:-csm_secret}@db:5432/csm_silks
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CHANNEL_LAYER_BACKEND=redis
      - OTP_DEV_FALLBACK_ENABLED=False
      - PAYMENT_DEV_FALLBACK_ENABLED=False
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/backend/media
      - log_data:/app/backend/logs
    restart: unless-stopped
    command: celery --workdir backend -A csm_backend worker --loglevel=info --concurrency=4 --max-tasks-per-child=500

  celery_beat:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgres://csm:${POSTGRES_PASSWORD:-csm_secret}@db:5432/csm_silks
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CHANNEL_LAYER_BACKEND=redis
      - OTP_DEV_FALLBACK_ENABLED=False
      - PAYMENT_DEV_FALLBACK_ENABLED=False
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery --workdir backend -A csm_backend beat --loglevel=info

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: csm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csm_secret}
      POSTGRES_DB: csm_silks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csm -d csm_silks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dist:
  media_data:
  static_data:
  log_data:
